name: Feature request
description: Propose a focused improvement to Callya
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS
        - Windows
        - Both desktop platforms
        - Landing page or documentation
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the smallest useful version and any alternatives considered.
    validations:
      required: true
  - type: textarea
    id: privacy
    attributes:
      label: Privacy and cost considerations
      description: Note any effect on capture, stored data, OpenAI usage, or API cost.
